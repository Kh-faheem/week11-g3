on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

jobs:
  lint_job:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo On the Runner
        uses: actions/checkout@v6

      - name: Install Dev Dependencies
        run: npm install

      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"

      - name: Lint CSS Files
        run: npx stylelint "**/*.css"

  build-job:
    runs-on: ubuntu-latest
    needs: lint_job
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: npm install

      - name: Build Job
        run: echo "Starting Build Job"
