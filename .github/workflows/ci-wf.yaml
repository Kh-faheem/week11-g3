on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

jobs:
  lint_job:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo On the Runner
        uses: actions/checkout@v6

      - name: Install Dev Dependencies
        run: npm install

      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"

      - name: Lint CSS Files
        run: npx stylelint "**/*.css"

  build-job:
    runs-on: ubuntu-latest
    needs: lint_job
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: npm install

      - name: Build Job
        run: echo "Starting Build Job"
      - name: Build Website with Parcel
        run: npx parcel build src/index.html --dist-dir build --public-url ./ --no-cache
  image-build-job:      
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo to Build Image
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Image
        run: docker image build build -t ${{ secrets.DOCKERHUB_USERNAME }}/app:latest .
      - name: List Image on the Runner
        run: docker image ls
      - name: Create Container on the Runner
        run: docker container run -d -p 2222:80 ${{ secrets.DOCKERHUB_USERNAME }}/app:latest
      - name: List Running Containers
        run: docker container ls    
      - name: Push Docker image on the Docker Hub
        run: docker image push ${{ secrets.DOCKERHUB_USERNAME }}/app:latest    

